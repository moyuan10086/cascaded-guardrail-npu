[project]
name = "cognit-guard"
version = "1.0.0"
description = "COGNIT-Guard: Calibrated Low-Latency Cascaded Decision Framework for Real-Time LLM Safety Guardrails"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hao Chen", email = "moyuan@stu.gpnu.edu.cn" }
]
dependencies = [
    "transformers==5.5.4",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "jieba>=0.42.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.10.0",
]
ascend = []
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
